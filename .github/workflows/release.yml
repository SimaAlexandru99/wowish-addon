# Packages and uploads on a version tag (v0.1.0-beta, v1.0.0) with the BigWigs packager.
# Uploads happen only when the TOC has X-Curse-Project-ID / X-Wago-ID and these repository
# secrets exist: CF_API_TOKEN, WAGO_API_TOKEN. Without them it only builds the GitHub release.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: BigWigsMods/packager@v2
